services:
  customer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  address-service:
    build: ./address-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082

  customer-service:
    build: ./customer-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-with-at-least-32-characters}
      ADDRESS_SERVICE_URL: http://address-service:8082
    depends_on:
      customer-db:
        condition: service_healthy
      address-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ADDRESS_SERVICE_URL: http://address-service:8082
    depends_on:
      customer-service:
        condition: service_started
      address-service:
        condition: service_started

volumes:
  customer_db_data:
