spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/customers/**,/api/auth/**,/v3/api-docs/customer
            - id: address-service
              uri: ${ADDRESS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/addresses/**,/v3/api-docs/address

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
